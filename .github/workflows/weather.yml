name: Update weather data

on:
  schedule:
    - cron: "0 * * * *"   # top of each hour, UTC (GitHub may start it a few minutes late)
  workflow_dispatch:        # adds a "Run workflow" button for testing

permissions:
  contents: write           # lets the workflow commit the data files

concurrency:
  group: weather
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch latest observations
        env:
          ECOWITT_APPLICATION_KEY: ${{ secrets.ECOWITT_APPLICATION_KEY }}
          ECOWITT_API_KEY: ${{ secrets.ECOWITT_API_KEY }}
          ECOWITT_MAC: ${{ secrets.ECOWITT_MAC }}
        run: python fetch_weather.py

      - name: Commit if anything changed
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No new observations"
          else
            git commit -m "Weather update $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
